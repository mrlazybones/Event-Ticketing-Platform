name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux:
    name: Verify (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_ARGS: --batch-mode --no-transfer-progress --show-version
      DB_URL: jdbc:postgresql://localhost:5432/event_ticketing
      DB_USERNAME: event_ticketing
      DB_PASSWORD: event_ticketing
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: event_ticketing
          POSTGRES_USER: event_ticketing
          POSTGRES_PASSWORD: event_ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_ticketing -d event_ticketing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify with PostgreSQL
        run: bash scripts/verify.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-ubuntu-latest
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            booking-api/target/smoke-test*.log
          if-no-files-found: ignore

  verify-windows:
    name: Verify (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MAVEN_ARGS: --batch-mode --no-transfer-progress --show-version
      # This runner has no Docker. Database checks run in the Linux job; do not treat this job as that proof.
      DATABASE_CHECKS: skipped
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify without a database
        shell: powershell
        run: .\scripts\verify.ps1 -DskipITs

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows-latest
          path: |
            **/target/surefire-reports/
            booking-api/target/smoke-test*.log
          if-no-files-found: ignore
